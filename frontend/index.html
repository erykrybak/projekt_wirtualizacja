<!doctype html>
<html lang="pl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Przepisy i lista zakupów</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <div class="container">
            <header>
                <h1>Przepisy i lista zakupów</h1>
            </header>

            <nav>
                <button
                    type="button"
                    class="nav-btn active"
                    id="btn-recipes"
                    onclick="showView('recipes-view')"
                >
                    Przepisy
                </button>
                <button
                    type="button"
                    class="nav-btn"
                    id="btn-add"
                    onclick="showView('add-recipe-view')"
                >
                    Dodaj przepis
                </button>
            </nav>

            <section id="recipes-view" class="view active">
                <h2>Lista przepisów</h2>
                <ul id="recipes-list" class="recipe-list"></ul>
            </section>

            <section id="recipe-detail-view" class="view">
                <div class="detail-actions">
                    <button
                        type="button"
                        class="back-btn"
                        onclick="showView('recipes-view')"
                    >
                        ← Wróć do przepisów
                    </button>
                    <button
                        type="button"
                        class="danger-btn"
                        id="btn-delete-recipe"
                    >
                        Usuń przepis
                    </button>
                </div>
                <h2 id="detail-title"></h2>
                <div id="detail-content" class="md-content"></div>
            </section>

            <section id="add-recipe-view" class="view">
                <h2>Dodaj nowy przepis</h2>
                <form id="add-recipe-form">
                    <div class="field">
                        <label for="title">Tytuł przepisu</label>
                        <input
                            type="text"
                            id="title"
                            placeholder="np. Szakszuka"
                            required
                        />
                    </div>
                    <div class="field">
                        <label for="filename">Nazwa pliku</label>
                        <input
                            type="text"
                            id="filename"
                            placeholder="np. szakszuka.md"
                            required
                        />
                    </div>
                    <div class="field">
                        <label for="content">Treść przepisu (Markdown)</label>
                        <textarea
                            id="content"
                            rows="10"
                            placeholder="# Szakszuka&#10;&#10;## Składniki&#10;- 3 jajka&#10;- łyżka masła&#10;&#10;## Przygotowanie&#10;1. Roztop masło na patelni..."
                            required
                        ></textarea>
                    </div>
                    <button type="submit" class="submit-btn">
                        Zapisz przepis
                    </button>
                </form>
                <div id="form-message" class="message"></div>
            </section>
        </div>

        <script src="/app.js"></script>
    </body>
</html>
