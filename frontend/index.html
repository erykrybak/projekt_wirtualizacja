<!doctype html>
<html lang="pl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Przepisy i lista zakupów</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <div class="container">
            <header>
                <h1>Przepisy i lista zakupów</h1>
            </header>

            <nav>
                <button
                    type="button"
                    class="nav-btn active"
                    id="btn-recipes"
                    onclick="showView('recipes-view')"
                >
                    Przepisy
                </button>
                <button
                    type="button"
                    class="nav-btn"
                    id="btn-add"
                    onclick="showView('add-recipe-view')"
                >
                    Dodaj przepis
                </button>
            </nav>

            <section id="recipes-view" class="view active">
                <h2>Lista przepisów</h2>
                <ul id="recipes-list" class="recipe-list"></ul>
            </section>

            <section id="add-recipe-view" class="view">
                <h2>Dodaj nowy przepis</h2>
                <form id="add-recipe-form">
                    <div class="field">
                        <label for="title">Tytuł przepisu</label>
                        <input
                            type="text"
                            id="title"
                            placeholder="np. Szakszuka"
                            required
                        />
                    </div>
                    <div class="field">
                        <label for="filename">Nazwa pliku</label>
                        <input
                            type="text"
                            id="filename"
                            placeholder="np. szakszuka.md"
                            required
                        />
                    </div>
                    <button type="submit" class="submit-btn">
                        Zapisz przepis
                    </button>
                </form>
                <div id="form-message" class="message"></div>
            </section>
        </div>

        <script src="/app.js"></script>
    </body>
</html>
